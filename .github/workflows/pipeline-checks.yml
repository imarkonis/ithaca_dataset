# Static checks on every pull request that touches the pipeline code.
# Neither step runs the pipeline or needs data: both only read the R scripts.
name: pipeline-checks

on:
  pull_request:
    paths: ["code/**", "tools/**", "docs/pipeline_manifest.md"]
  push:
    branches: [master]
    paths: ["code/**", "tools/**", "docs/pipeline_manifest.md"]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: File links between scripts 00-05 (tools/check_static.R)
        run: Rscript tools/check_static.R
      - name: Pipeline manifest is up to date (tools/make_manifest.R --check)
        if: success() || failure()
        run: Rscript tools/make_manifest.R --check
